# arayhan.com behind Nginx. setup-server.sh copies this to /etc/nginx/sites-available once
# (a copy, not a symlink: certbot adds its TLS lines to the installed file, and a later
# `git reset` in the repo must not wipe them). Edit the installed file on the server after that.

server {
    listen 80;
    listen [::]:80;
    server_name www.arayhan.com;
    return 301 $scheme://arayhan.com$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name arayhan.com;

    location /_next/static/ {
        proxy_pass http://127.0.0.1:3200;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
